<script>
// Page loader - loads page HTML files dynamically
const _pageCache = {};
async function loadPageContent(pageName) {
  if (_pageCache[pageName]) return _pageCache[pageName];
  try {
    const r = await fetch('pages/' + pageName + '.html');
    const html = await r.text();
    _pageCache[pageName] = html;
    return html;
  } catch(e) {
    console.error('Failed to load page:', pageName, e);
    return '';
  }
}
// Store modals-ready promise globally so init() in app.js can await it
window._modalsReady = (async function initPageLoader() {
  // Load modals into modal-container
  try {
    const r = await fetch('pages/modals.html');
    const html = await r.text();
    document.getElementById('modal-container').innerHTML = html;
  } catch(e) {}
})();
</script>
