<section class="page" id="page-daily-reports">
        <div class="section-header">
          <div class="section-header-left">
            <div class="section-title-main">Daily Reports</div>
            <div class="section-title-sub">Complete sales, revenue, and sq. footage details for any day</div>
          </div>
          <div style="display:flex;gap:10px;align-items:center;">
            <input class="form-control" type="date" id="daily-rep-date" style="width:175px;" onchange="loadDailyReport()">
            <button class="btn btn-primary" onclick="exportDailyReportPDF()">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Export PDF
            </button>
          </div>
        </div>
        <div class="card">
          <div class="card-body" id="daily-report-content">
            <div class="empty-state">
              <div class="empty-icon"><svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
              <h4>Select a Date</h4>
              <p>Choose a date above to view the report</p>
            </div>
          </div>
        </div>
      </section>
