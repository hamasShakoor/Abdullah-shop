<section class="page" id="page-products">
        <div class="section-header">
          <div class="section-header-left">
            <div class="section-title-main">Products</div>
            <div class="section-title-sub">Add your products — they will appear automatically in New Sale</div>
          </div>
        </div>

        <!-- Add Product Form -->
        <div class="card mb-4">
          <div class="card-header">
            <div class="card-header-left">
              <div class="card-header-icon"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
              <h3>Add New Product</h3>
            </div>
          </div>
          <div class="card-body">
            <div class="form-row cols-3">
              <div class="form-group">
                <label>Product Name</label>
                <input class="form-control" id="prod-name" placeholder="e.g. Outdoor Flex, 3D Acrylic...">
              </div>
              <div class="form-group">
                <label>Category</label>
                <select class="form-control" id="prod-category">
                  <option value="3d_signboard">3D SIGN BOARD</option>
                  <option value="number_plate">NUMBER PLATE</option>
                  <option value="qatba_plate">QATBA PLATE</option>
                  <option value="stiker">STICKER</option>
                </select>
              </div>
              <div class="form-group">
                <label>Default Price (Rs.)</label>
                <input class="form-control" type="number" id="prod-price" placeholder="e.g. 200" min="0">
              </div>
            </div>
            <div style="display:flex;justify-content:flex-end;margin-top:4px;">
              <button class="btn btn-primary" onclick="saveProduct()">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Add Product
              </button>
            </div>
          </div>
        </div>

        <!-- Products List -->
        <div class="card">
          <div class="card-header">
            <div class="card-header-left">
              <div class="card-header-icon"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg></div>
              <h3>All Products</h3>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>#</th><th>Product Name</th><th>Category</th><th>Default Price</th><th>Added On</th><th>Action</th></tr>
              </thead>
              <tbody id="products-table-body">
                <tr><td colspan="6" class="loading-state"><div class="loading-spinner"></div>Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
