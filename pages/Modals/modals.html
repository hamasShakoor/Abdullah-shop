  <!-- ===== FLEX PAYMENT MODAL ===== -->
  <div id="fx-payment-modal">
    <div class="fx-modal-box">
      <div class="fx-modal-header">
        <div>
          <div class="fx-modal-title">Add Payment</div>
          <div class="fx-modal-info" id="fx-pay-modal-info"></div>
        </div>
        <button onclick="closeFxPaymentModal()" class="fx-modal-close">✕</button>
      </div>
      <input type="hidden" id="fx-pay-bill-id">
      <div class="fx-modal-grid">
        <div>
          <label class="fx-modal-label">Payment Date</label>
          <input class="form-control fx-modal-input" type="date" id="fx-pay-date">
        </div>
        <div>
          <label class="fx-modal-label">Amount (Rs.) *</label>
          <input class="form-control fx-modal-input-amount" type="number" id="fx-pay-amount" min="1" placeholder="0">
        </div>
      </div>
      <div class="fx-modal-field">
        <label class="fx-modal-label">Payment Method</label>
        <select class="form-control fx-modal-input" id="fx-pay-method">
          <option value="cash">Cash</option>
          <option value="jazzcash">JazzCash</option>
          <option value="easypaisa">Easypaisa</option>
          <option value="bank_account">Bank Transfer</option>
        </select>
      </div>
      <div class="fx-modal-notes-field">
        <label class="fx-modal-label">Notes</label>
        <input class="form-control fx-modal-input" id="fx-pay-notes" placeholder="Optional...">
      </div>
      <!-- Payment history for this bill -->
      <div id="fx-pay-history" class="fx-pay-history"></div>
      <button onclick="submitFlexPayment()" class="fx-modal-save-btn">
        ✓ Save Payment
      </button>
    </div>
  </div>

  <!-- ===== SALE PAYMENT MODAL ===== -->
  <div class="modal-overlay" id="sale-payment-modal">
    <div class="modal" style="max-width:480px;">
      <div class="modal-header">
        <div>
          <h3>Add Balance Payment</h3>
          <div class="sale-pay-modal-info" id="sale-pay-modal-info"></div>
        </div>
        <button class="modal-close" onclick="closeSalePaymentModal()">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="sale-pay-sale-id">
        <div class="sale-pay-grid">
          <div class="form-group">
            <label>Payment Date</label>
            <input class="form-control" type="date" id="sale-pay-date">
          </div>
          <div class="form-group">
            <label>Amount (Rs.)</label>
            <input class="form-control" type="number" id="sale-pay-amount" min="1" step="1" placeholder="0">
          </div>
        </div>
        <div class="form-group">
          <label>Payment Method</label>
          <select class="form-control" id="sale-pay-method">
            <option value="cash">Cash</option>
            <option value="jazzcash">JazzCash</option>
            <option value="easypaisa">Easypaisa</option>
            <option value="bank_account">Bank Transfer</option>
          </select>
        </div>
        <div class="form-group">
          <label>Notes</label>
          <input class="form-control" id="sale-pay-notes" placeholder="Optional...">
        </div>
        <div id="sale-pay-history" class="sale-pay-history"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeSalePaymentModal()">Cancel</button>
        <button class="btn btn-primary" onclick="submitSalePayment()">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          Save Payment
        </button>
      </div>
    </div>
  </div>

  <!-- ============================== BILL MODAL ============================== -->
  <div class="modal-overlay" id="modal-bill-overlay">
    <div class="modal" style="max-width:780px;">
      <div class="modal-header">
        <h3>Invoice Preview</h3>
        <div style="display:flex;gap:8px;align-items:center;">
          <button class="btn btn-ghost btn-sm" id="bill-print-btn" type="button" onclick="printBillPage()">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
            Print
          </button>
          <button class="btn btn-primary btn-sm" id="bill-save-pdf-btn" type="button" onclick="doPrintBill()">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Save PDF
          </button>
          <button class="modal-close" onclick="closeBillModal()">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
      <div class="modal-body">
        <div id="bill-content"></div>
      </div>
    </div>
  </div>

  <!-- ============================== CONFIRM MODAL ============================== -->
  <div class="modal-overlay" id="modal-confirm-overlay">
    <div class="modal confirm-modal" style="max-width:400px;">
      <div class="modal-body" style="text-align:center;padding:32px 28px;">
        <div class="confirm-icon-wrap danger">
          <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </div>
        <h3 style="font-size:18px;font-weight:800;margin-bottom:8px;">Delete Sale?</h3>
        <p style="color:var(--muted);font-size:13.5px;line-height:1.6;" id="confirm-msg">This sale will be permanently deleted and cannot be recovered.</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeConfirm()">Cancel</button>
        <button class="btn btn-danger" id="confirm-yes-btn">Yes, Delete</button>
      </div>
    </div>
  </div>
