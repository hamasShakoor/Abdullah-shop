<section class="page" id="page-owner-ledger">
        <div class="section-header">
          <div class="section-header-left">
            <div class="section-title-main">Owner Ledger</div>
            <div class="section-title-sub">Track owner withdrawals and returns with date-wise linked records</div>
          </div>
          <div class="owner-header-filters">
            <select class="form-control" id="owner-filter-name" style="width:150px;" onchange="loadOwnerLedger()">
              <option value="">All Owners</option>
              <option value="ABDULLAH">ABDULLAH</option>
              <option value="NAEEM HASSN">NAEEM HASSN</option>
            </select>
            <input class="form-control" type="date" id="owner-filter-from" style="width:150px;" onchange="loadOwnerLedger()">
            <input class="form-control" type="date" id="owner-filter-to" style="width:150px;" onchange="loadOwnerLedger()">
            <button class="btn btn-ghost btn-sm" onclick="clearOwnerLedgerFilters()">Clear</button>
          </div>
        </div>

        <div class="card mb-4">
          <div class="card-header">
            <div class="card-header-left">
              <div class="card-header-icon"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
              <h3>Owner Entry</h3>
            </div>
          </div>
          <div class="card-body">
            <div class="owner-form-grid">
              <div class="form-group">
                <label>Owner</label>
                <select class="form-control" id="owner-owner" onchange="syncOwnerEntryKindUI()">
                  <option value="ABDULLAH">ABDULLAH</option>
                  <option value="NAEEM HASSN">NAEEM HASSN</option>
                  <option value="__custom_owner__">+ Custom Owner</option>
                </select>
                <input class="form-control" id="owner-custom-name" style="display:none;margin-top:8px;" placeholder="Enter new owner name" oninput="onOwnerCustomInput()">
              </div>
              <div class="form-group">
                <label>Date</label>
                <input class="form-control" type="date" id="owner-date">
              </div>
              <div class="form-group">
                <label>Type</label>
                <select class="form-control" id="owner-kind" onchange="syncOwnerEntryKindUI()">
                  <option value="withdraw">Withdrawal</option>
                  <option value="return">Return</option>
                </select>
              </div>
              <div class="form-group">
                <label>Amount (Rs.)</label>
                <input class="form-control" type="number" id="owner-amount" min="0" step="1" placeholder="e.g. 5000">
              </div>
              <div class="form-group" id="owner-linked-wrap" style="display:none;">
                <label>Linked Withdrawal</label>
                <select class="form-control" id="owner-linked"></select>
              </div>
            </div>

            <div class="form-group mb-3">
              <label>Notes</label>
              <input class="form-control" id="owner-notes" placeholder="Optional note...">
            </div>

            <div class="owner-form-actions">
              <button class="btn btn-ghost" id="owner-cancel-btn" style="display:none;" onclick="cancelOwnerEdit()">Cancel Edit</button>
              <button class="btn btn-outline-primary" id="owner-update-btn" style="display:none;" onclick="applyOwnerUpdate()">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
                Update Owner Entry
              </button>
              <button class="btn btn-success" id="owner-save-btn" onclick="saveOwnerEntry()">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                Save Owner Entry
              </button>
            </div>
          </div>
        </div>

        <div class="owner-stats-grid">
          <div class="stat-card accent-red">
            <div class="stat-top"><div><div class="stat-label">Total Withdrawals</div><div class="stat-value sm" id="owner-total-withdraw">—</div></div><div class="stat-icon-wrap red"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div></div>
          </div>
          <div class="stat-card accent-green">
            <div class="stat-top"><div><div class="stat-label">Total Returns</div><div class="stat-value sm" id="owner-total-return">—</div></div><div class="stat-icon-wrap green"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div></div>
          </div>
          <div class="stat-card accent-blue">
            <div class="stat-top"><div><div class="stat-label">Outstanding</div><div class="stat-value sm" id="owner-net-outstanding">—</div></div><div class="stat-icon-wrap blue"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div></div>
          </div>
        </div>

        <div class="card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Group Date</th>
                  <th>Owner</th>
                  <th>Type</th>
                  <th>Entry Amount</th>
                  <th>Taken</th>
                  <th>Returned</th>
                  <th>Remaining</th>
                  <th>Notes</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="owner-table-body">
                <tr><td colspan="9" class="loading-state"><div class="loading-spinner"></div>Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
