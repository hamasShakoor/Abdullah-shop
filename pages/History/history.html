<section class="page" id="page-history">
        <div class="section-header">
          <div class="section-header-left">
            <div class="section-title-main">Sales History</div>
            <div class="section-title-sub">Search, filter and manage all transactions</div>
          </div>
          <button class="btn btn-primary" onclick="showPage('new-sale')">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New Sale
          </button>
        </div>

        <div class="card">
          <div class="filter-bar">
            <div class="form-group grow">
              <label>Search</label>
              <div class="search-input-wrap">
                <svg class="search-icon" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input class="form-control" id="hist-search" placeholder="Search by Bill #, customer name or phone..." oninput="debounceHistSearch()">
              </div>
            </div>
            <div class="form-group">
              <label>From Date</label>
              <input class="form-control" type="date" id="hist-from" onchange="loadHistory()">
            </div>
            <div class="form-group">
              <label>To Date</label>
              <input class="form-control" type="date" id="hist-to" onchange="loadHistory()">
            </div>
            <div class="hist-filter-actions">
              <button class="btn btn-ghost btn-sm" onclick="clearHistSearch()">
                <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                Clear
              </button>
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Bill No.</th>
                  <th>Customer</th>
                  <th>Phone</th>
                  <th>Amount</th>
                  <th>Paid</th>
                  <th>Balance</th>
                  <th>Status</th>
                  <th>Date</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="history-body">
                <tr><td colspan="9" class="loading-state"><div class="loading-spinner"></div>Loading...</td></tr>
              </tbody>
            </table>
          </div>
          <div id="history-pagination" class="pagination"></div>
        </div>
      </section>
